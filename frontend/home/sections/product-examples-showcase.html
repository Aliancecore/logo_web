<!--
  product-examples-showcase.html — "What goes live under your name": three
  hand-drawn sample sites (coffee cooperative, beauty salon, fabric shop),
  each on a tilting 3D "stage" with a browser window and a phone in front.
  Needs, in this order: shared/styles/tilt-3d-stage.css (stage/rig engine),
  shared/styles/specimen-shell.css (browser/phone/site chrome),
  home/styles/examples-showcase.css (this page's own layout, colours and
  drawings). Needs shared/scripts/tilt-3d.js for the tilt/parallax behaviour
  (reads/writes the data-tilt elements below).
-->
    <!-- ============ Examples ============
         Three sample sites, drawn in HTML/CSS (no screenshots), one per package.
         The drawings are hidden from assistive tech: each caption says what the site does. -->
    <section class="section showcase" id="examples" aria-labelledby="examples-title">
      <div class="wrap">
        <header class="section-head" data-reveal>
          <h2 class="h2" id="examples-title">What goes live under your name.</h2>
          <p class="section-head__intro">Three sample sites, one for each package. Yours is built around your own name, prices and photos, and made for phones first.</p>
        </header>

        <ul class="cases" role="list">

          <!-- Startup: coffee cooperative -->
          <li class="cases__item" data-reveal style="--d:0">
            <figure class="case">
              <div class="case__stage" aria-hidden="true" data-tilt>
                <div class="case__rig">
                  <div class="browser">
                    <div class="browser__bar">
                      <span class="browser__dots"><i></i><i></i><i></i></span>
                      <span class="browser__url"><svg class="icon"><use href="#i-lock"/></svg><span>elgonridgecoffee<span class="browser__tld">.co.ug</span></span></span>
                    </div>
                    <div class="browser__view site site--coffee">
                      <div class="site__nav">
                        <span class="site__logo"><i class="site__bean"></i>Elgon Ridge</span>
                        <span class="site__links"><i></i><i></i><i></i></span>
                        <span class="site__btn site__btn--ghost">Contact</span>
                      </div>
                      <div class="coffee__hero">
                        <svg class="coffee__hills" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice"><use href="#art-elgon"/></svg>
                        <div class="coffee__copy">
                          <span class="site__title">Arabica from the slopes of Mount Elgon.</span>
                          <i class="site__line" style="--w:72%"></i>
                          <span class="site__btn">Talk to the co-op</span>
                        </div>
                      </div>
                      <div class="site__cols">
                        <span class="site__card"><i class="site__line" style="--w:62%"></i><i class="site__line site__line--soft"></i><i class="site__line site__line--soft" style="--w:78%"></i></span>

                      </div>
                    </div>
                  </div>

                  <div class="phone">
                    <div class="phone__frame">
                      <div class="phone__screen site site--coffee">
                        <div class="site__nav">
                          <span class="site__logo"><i class="site__bean"></i>Elgon Ridge</span>
                          <i class="site__burger"></i>
                        </div>
                        <div class="coffee__hero">
                          <svg class="coffee__hills" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice"><use href="#art-elgon"/></svg>
                          <div class="coffee__copy">
                            <span class="site__title">Arabica from Mount Elgon.</span>
                            <span class="site__btn">Talk to the co-op</span>

                        </div>
                        <div class="site__cols">

                          <span class="site__card"><i class="site__line" style="--w:44%"></i><i class="site__line site__line--soft"></i><i class="site__line site__line--soft" style="--w:68%"></i></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <figcaption class="case__cap">
                <p class="case__kind">Coffee cooperative, Kapchorwa</p>
                <h3 class="case__domain"><span class="sr-only">Sample site: </span>elgonridgecoffee<span class="case__tld">.co.ug</span></h3>
                <p class="case__desc">A first website: the farms, the harvest and an easy way for buyers to get in touch.</p>
