<!--
  final-cta.html — "Let's give <your-domain> a logo people remember": the
  closing call-to-action panel (call / email buttons).
  Needs: shared/styles/final-cta.css. <span data-slug>/<span data-tld> are
  filled live by shared/scripts/business-name-domain.js from whatever the
  visitor typed in another page's domain search. Unlike home's version of
  this section, the "not your business name" note here links to
  domains.html's search field instead of focusing a field on this page
  (logo-design.html has none).
-->

    <!-- ============ Final call to action ============ -->
    <section class="section contact" id="contact" aria-labelledby="cta-title">
      <div class="wrap">
        <div class="cta on-blue" data-reveal>
          <h2 class="cta__title" id="cta-title">
            <span class="cta__pre">Let's give</span>
            <span class="cta__domain"><span data-slug>yourbusiness</span><span data-tld>.co.ug</span></span>
            <span class="cta__post">a logo people remember.</span>
          </h2>

          <div class="cta__actions">
            <a class="btn btn--action btn--lg" href="tel:+256709781426">
              <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
              Call +256 709 781426
            </a>
            <a class="btn btn--ghost btn--lg" href="mailto:sales@logoswebsiteservices.com" data-mail-topic="a logo">
              <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
              Email sales
            </a>
          </div>
          <p class="cta__note">Not your business name? <a href="domains.html#biz-name">Type it on the domains page</a>.</p>
        </div>
      </div>
    </section>
