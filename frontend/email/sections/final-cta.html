<!--
  final-cta.html — "Let's set up hello@<your-domain> this week": the
  closing call-to-action panel (call / email buttons). Same shared
  component as home/sections/final-cta.html, with this page's own title
  text and a wider --cta-extra (12, for "hello@" + ".co.ug" — see
  shared/styles/final-cta.css's own header for what --cta-extra does).
  Needs: shared/styles/final-cta.css. <span data-slug>/<span data-tld> are
  filled live by shared/scripts/business-name-domain.js from whatever the
  visitor typed in the hero's .namer field, above.
-->
    <!-- ============ Final call to action ============ -->
    <section class="section contact" id="contact" aria-labelledby="cta-title">
      <div class="wrap">
        <div class="cta on-blue" data-reveal>
          <h2 class="cta__title" id="cta-title">
            <span class="cta__pre">Let's set up</span>
            <span class="cta__domain" style="--cta-extra: 12">hello@<span data-slug>yourbusiness</span><span data-tld>.co.ug</span></span>
            <span class="cta__post">this week.</span>
          </h2>

          <div class="cta__actions">
            <a class="btn btn--action btn--lg" href="tel:+256709781426">
              <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
              Call +256 709 781426
            </a>
            <a class="btn btn--ghost btn--lg" href="mailto:sales@logoswebsiteservices.com" data-mail-topic="business email">
              <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
              Email sales
            </a>
          </div>
          <p class="cta__note">Not your business name? <a href="#namer-input" data-focus-name="namer-input">Type it above</a>.</p>
        </div>
      </div>
    </section>
