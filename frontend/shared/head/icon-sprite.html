<!--
  icon-sprite.html — the inline SVG icon sprite (<symbol> defs, used via
  <svg class="icon"><use href="#i-name"/></svg> elsewhere in the page).
  Placed once near the top of <body>.

  This is home's (index.html's) sprite ONLY — copied verbatim from the
  original frontend/index.html, byte-for-byte, 24 symbols. It is kept
  separate from shared/head/icon-sprite-inner.html (the other sprite, used
  by the 7 inner pages) because the two were never the same file in the
  original site: diffing all 8 original pages showed home shipping its own
  smaller sprite (built only from the icons home's own markup uses,
  including "i-bag" for the fabric-shop example) while the 7 inner pages
  all shipped one larger, mutually byte-identical sprite of their own (see
  icon-sprite-inner.html's header for that one). Merging the two into a
  single always-identical sprite was tried first (see git history of this
  file / shared/README.md) and abandoned: with one shared sprite injected
  unconditionally on every page by build/assemble.py, home's generated
  output could never again be byte-identical to the original index.html
  once any inner-page symbol was added to it. Keeping two fixed files, one
  per original sprite, is what makes build/assemble.py's output match the
  original exactly on every page, including home.

  home/page.manifest.json does not need an "icon_sprite" override: this
  file is build/assemble.py's default. Only the 7 inner pages' manifests
  set "icon_sprite": "shared/head/icon-sprite-inner.html".

  Do not add symbols here for an inner page's icon — that page's manifest
  already points at icon-sprite-inner.html, which has them. Only touch this
  file if index.html's own markup starts using a new icon.
-->
