<!--
  icon-sprite-inner.html — the inline SVG icon sprite (<symbol> defs, used
  via <svg class="icon"><use href="#i-name"/></svg> elsewhere in the page)
  for the 7 "inner" pages: domains, website-design, hosting, email,
  logo-design, digital-marketing, about.

  Copied verbatim, byte-for-byte, from the original site: all 7 of those
  pages shipped this exact 33-symbol sprite, in this exact order (confirmed
  by hashing the <svg class="sprite">...</svg> block of each original page —
  identical md5 on all 7). It is NOT trimmed to "only the symbols this
  particular page's own <use> tags reference" — several symbols here are
  unused by any single inner page's own content and only used by a
  different one of the 7 (e.g. i-transfer is domains.html-only, i-external
  is about.html-only, i-backup/i-card/i-unlock/i-move are hosting.html-only,
  i-pen/i-megaphone are digital-marketing.html-only, mark-nakato is
  logo-design.html-only). That is deliberate: the original site already
  shipped every inner page this same bigger sprite, so copying it whole is
  what makes build/assemble.py's generated output byte-identical to each
  original inner page. Trimming per page (tried first, see shared/README.md
  and shared/head/README.md) cannot reproduce that: it produces a smaller,
  different sprite than the one each original page actually shipped.

  home/index.html does NOT use this file — it has its own, smaller,
  different original sprite: shared/head/icon-sprite.html (see that file's
  header). Each of the 7 inner pages' page.manifest.json sets
  "icon_sprite": "shared/head/icon-sprite-inner.html" to select this one;
  home's manifest omits that key and gets icon-sprite.html, the default in
  build/assemble.py.

  Do not add or remove a symbol here for one page's sake: this file is a
  fixed copy of what the original site shipped, not a per-page minimal set.
-->
