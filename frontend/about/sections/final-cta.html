  home/sections/final-cta.html but with about's own note text ("Other
  lines: ..." instead of home's "Not your business name? ..."), so this stays
  a page-local file rather than a shared one (page content differs).

  filled live by shared/scripts/business-name-domain.js from whatever the

-->
