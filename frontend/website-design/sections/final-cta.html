<!--
  final-cta.html — closing call-to-action panel: "Let's put
  yourbusiness.co.ug online this week", call/email buttons, and a note
  pointing back at the hero's name field. Identical component to home's
  own final-cta.html (same .contact/.cta* classes), only the copy differs.
  Needs shared/styles/final-cta.css (.contact, .cta*). Needs
  shared/scripts/business-name-domain.js to fill [data-slug]/[data-tld] and
  to wire data-mail-topic/data-focus-name on its two links.
-->
    <!-- ============ Final call to action ============ -->
    <section class="section contact" id="contact" aria-labelledby="cta-title">
      <div class="wrap">
        <div class="cta on-blue" data-reveal>
          <h2 class="cta__title" id="cta-title">
            <span class="cta__pre">Let's put</span>
            <span class="cta__domain"><span data-slug>yourbusiness</span><span data-tld>.co.ug</span></span>
            <span class="cta__post">online this week.</span>
          </h2>

          <div class="cta__actions">
            <a class="btn btn--action btn--lg" href="tel:+256709781426">
              <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>
              Call +256 709 781426
            </a>
            <a class="btn btn--ghost btn--lg" href="mailto:sales@logoswebsiteservices.com" data-mail-topic="a website">
              <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
              Email sales
            </a>
          </div>
          <p class="cta__note">Not your business name? <a href="#namer-input" data-focus-name="namer-input">Type it above</a>.</p>
        </div>
      </div>
    </section>
