<style>
  :root {
    --navy: #0F172A;
    --blue: #1D4ED8;
    --blue-deep: #1E40AF;
    --blue-light: #7799F8;
    --orange: #F97316;
    --paper: #F8FAFC;
    --paper-soft: #CBD5E1;
    --ink: #1E293B;
    --slate: #64748B;
    --line: rgba(15, 23, 42, .12);
    --ease: cubic-bezier(.2, .75, .25, 1);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; scroll-behavior: smooth; }

  body {
    font-family: 'Inter', Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    overflow-x: hidden;
  }

  html { scroll-snap-type: y mandatory; }

  /* ---------- Scroll progress bar ---------- */
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 4px;
    width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--orange));
    z-index: 20;
    transition: width .1s linear;
  }

  /* ---------- Language toggle ---------- */
  .lang-toggle {
    position: fixed;
    top: clamp(1rem, 2vw, 1.5rem);
    left: clamp(1rem, 2vw, 1.5rem);
    z-index: 20;
    display: flex;
    background: rgba(255, 255, 255, .9);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 2px;
    backdrop-filter: blur(6px);
  }

  .lang-toggle button {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-weight: 700;
    font-size: .8rem;
    letter-spacing: .03em;
    border: none;
    background: transparent;
    color: var(--slate);
    padding: .4rem .85rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .25s var(--ease), color .25s var(--ease);
  }

  .lang-toggle button.is-active {
    background: var(--blue);
    color: #fff;
  }

  .slide.dark ~ .lang-toggle,
  section.dark + .lang-toggle { }

  /* ---------- Slides ---------- */
  section.slide {
    scroll-snap-align: start;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 6vw, 6rem);
    position: relative;
    overflow: hidden;
  }

  section.slide.dark { background: var(--navy); color: var(--paper-soft); }

  h1, h2, h3 {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-weight: 700;
    color: var(--navy);
    margin: 0;
  }

  .dark h1, .dark h2, .dark h3 { color: var(--paper); }

  p { margin: 0; }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--blue);
    font-weight: 700;
    font-size: clamp(.85rem, 1vw, 1rem);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }

  .dark .eyebrow { color: var(--orange); }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--orange);
    display: inline-block;
  }

  .lead {
    font-size: clamp(1.05rem, 1.6vw, 1.4rem);
    line-height: 1.5;
    color: var(--slate);
    max-width: 44rem;
  }

  .dark .lead { color: var(--paper-soft); }

  h1.title {
    font-size: clamp(2.4rem, 6vw, 4.6rem);
    line-height: 1.08;
    max-width: 50rem;
    margin-bottom: 1.5rem;
  }

  h1.title .accent { color: var(--orange); }

  h2.heading {
    font-size: clamp(1.9rem, 4vw, 2.75rem);
    margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: clamp(1rem, 2.5vw, 2rem);
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(1.25rem, 2.5vw, 2rem);
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 32px rgba(15, 23, 42, .1);
  }

  .dark .card {
    background: rgba(255, 255, 255, .06);
    border-color: rgba(255, 255, 255, .14);
  }

  .dark .card:hover { box-shadow: 0 16px 32px rgba(0, 0, 0, .35); }

  .card h3 { font-size: clamp(1.1rem, 1.6vw, 1.35rem); margin-bottom: .6rem; }

  .card p {
    font-size: clamp(.95rem, 1.2vw, 1.05rem);
    line-height: 1.5;
    color: var(--slate);
  }

  .dark .card p { color: var(--paper-soft); }

  .stat-card .stat-number {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(2.5rem, 5vw, 3.75rem);
    color: var(--blue);
    line-height: 1;
    margin-bottom: .4rem;
  }

  .swatches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1.25rem;
    margin: clamp(2rem, 4vw, 3rem) 0;
  }

  .swatch {
    height: clamp(120px, 16vw, 180px);
    border-radius: 16px;
    display: flex;
    align-items: flex-end;
    padding: 1.25rem;
    font-weight: 700;
    transition: transform .3s var(--ease);
  }

  .swatch:hover { transform: translateY(-6px) scale(1.02); }

  .swatch span {
    display: block;
    font-weight: 400;
    font-size: .85em;
    opacity: .85;
  }

  .flow {
    display: flex;
    align-items: center;
    gap: clamp(.75rem, 2vw, 1.5rem);
    flex-wrap: wrap;
    margin: clamp(1.5rem, 4vw, 2.5rem) 0;
  }

  .flow-box {
    flex: 1 1 200px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.5rem 1.25rem;
    text-align: center;
    transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }

  .flow-box:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(15, 23, 42, .08); }

  .flow-box h3 { font-size: 1.05rem; margin-bottom: .5rem; }
  .flow-box p { font-size: .85rem; color: var(--slate); }

  .flow-arrow {
    font-size: 1.75rem;
    color: var(--blue);
    font-weight: 700;
  }

  .tech-list {
    display: flex;
    flex-direction: column;
    gap: clamp(1rem, 2.5vw, 1.5rem);
    max-width: 48rem;
  }

  .tech-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: clamp(.75rem, 2vw, 2rem);
    padding-bottom: clamp(1rem, 2.5vw, 1.5rem);
    border-bottom: 1px solid var(--line);
    transition: transform .3s var(--ease);
  }

  .tech-row:hover { transform: translateX(10px); }
  .tech-row:last-child { border-bottom: none; }

  .tech-row h3 { font-size: clamp(1.1rem, 1.8vw, 1.35rem); min-width: 14rem; }
  .tech-row p { font-size: clamp(.9rem, 1.2vw, 1.05rem); color: var(--slate); }

  .cta-link {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(1.4rem, 3.2vw, 2.4rem);
    color: var(--orange);
    background: rgba(249, 115, 22, .14);
    border: 2px solid var(--orange);
    border-radius: 16px;
    padding: 1rem 1.75rem;
    display: inline-block;
    text-decoration: none;
    position: relative;
    transition: transform .25s var(--ease), background-color .25s var(--ease);
  }

  .cta-link:hover,
  .cta-link:focus-visible {
    background: rgba(249, 115, 22, .24);
    transform: translateY(-2px);
  }

  .center { text-align: center; align-items: center; }

  /* ---------- Reveal on scroll (replays both ways) ---------- */
  [data-reveal] {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .7s var(--ease), transform .7s var(--ease);
    transition-delay: calc(var(--d, 0) * 80ms);
  }

  [data-reveal].is-in { opacity: 1; transform: none; }

  /* ---------- Dot navigation ---------- */
  nav.dots {
    position: fixed;
    right: clamp(.75rem, 2vw, 1.75rem);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: .6rem;
    z-index: 10;
  }

  nav.dots a {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--line);
    border: none;
    display: block;
    transition: all .3s var(--ease);
  }

  nav.dots a.is-active {
    background: var(--blue);
    width: 12px;
    height: 12px;
    box-shadow: 0 0 0 4px rgba(29, 78, 216, .18);
  }

  /* ---------- Floating ambient orbs (dark slides) ---------- */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: .35;
    pointer-events: none;
    z-index: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .orb { animation: drift 16s ease-in-out infinite; }
    .orb--2 { animation-duration: 20s; animation-direction: reverse; }
    .orb--3 { animation-duration: 24s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.12); }
    }

    .cta-link {
      animation: pulse-glow 2.6s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, .25); }
      50% { box-shadow: 0 0 0 14px rgba(249, 115, 22, 0); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cta-link, .card, .swatch, .flow-box, .tech-row { transition: none; }
  }

  @media (max-width: 640px) {
    nav.dots { display: none; }
  }
</style>

  var KEY = 'logos-pres-lang';
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var lang = safeGet(KEY) === 'fr' ? 'fr' : 'en';
  var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-lang-btn]'));

  function applyLang(next) {
    lang = next;
    var dict = TRANSLATIONS[lang];
    document.documentElement.lang = lang;
    document.title = dict['doc-title'];
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('[data-i18n-label]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-label');
      if (dict[key] !== undefined) el.setAttribute('aria-label', dict[key]);
    });
    buttons.forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-lang-btn') === lang);
    });
    safeSet(KEY, lang);
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { applyLang(btn.getAttribute('data-lang-btn')); });
  });

  applyLang(lang);

  /* ---------- Scroll reveal, replays in both directions ---------- */
  var revealEls = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));
  if ('IntersectionObserver' in window && revealEls.length) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        entry.target.classList.toggle('is-in', entry.isIntersecting);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('is-in'); });
  }

  /* ---------- Count-up numbers ---------- */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var counters = Array.prototype.slice.call(document.querySelectorAll('[data-count]'));
  var countedOnce = [];

  function animateCount(el) {
    var target = parseInt(el.getAttribute('data-count'), 10) || 0;
    if (reduceMotion.matches) { el.textContent = String(target); return; }
    var start = performance.now();
    var duration = 900;
    function step(now) {
      var p = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(eased * target));
      if (p < 1) window.requestAnimationFrame(step);
    }
    window.requestAnimationFrame(step);
  }

  if ('IntersectionObserver' in window && counters.length) {
    var countIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting && countedOnce.indexOf(entry.target) === -1) {
          countedOnce.push(entry.target);
          animateCount(entry.target);
        }
      });
    }, { threshold: 0.5 });
    counters.forEach(function (el) { countIo.observe(el); });
  } else {
    counters.forEach(function (el) { el.textContent = el.getAttribute('data-count'); });
  }

  /* ---------- Dot navigation + scroll progress ---------- */
  var dots = Array.prototype.slice.call(document.querySelectorAll('nav.dots a'));
  var slides = Array.prototype.slice.call(document.querySelectorAll('section.slide'));
  var byId = {};
  dots.forEach(function (dot) { byId[dot.getAttribute('href').slice(1)] = dot; });

  if ('IntersectionObserver' in window && dots.length) {
    var navIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          dots.forEach(function (d) { d.classList.remove('is-active'); });
          var dot = byId[entry.target.id];
          if (dot) dot.classList.add('is-active');
        }
      });
    }, { threshold: 0.6 });
    slides.forEach(function (slide) { navIo.observe(slide); });
  }

  var progressEl = document.getElementById('progress');
  function updateProgress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    progressEl.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  updateProgress();
})();
